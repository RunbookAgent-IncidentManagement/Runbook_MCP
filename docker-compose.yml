version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  product-service:
    build: ./backend/product_service
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce
    volumes:
      - ./backend/shared:/app/backend/shared:ro
    depends_on:
      postgres:
        condition: service_healthy

  cart-service:
    build: ./backend/cart_service
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce
    volumes:
      - ./backend/shared:/app/backend/shared:ro
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build: ./backend/order_service
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce
    volumes:
      - ./backend/shared:/app/backend/shared:ro
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build: ./backend/payment_service
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce
    volumes:
      - ./backend/shared:/app/backend/shared:ro
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build: ./backend/notification_service
    ports:
      - "8005:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce
    volumes:
      - ./backend/shared:/app/backend/shared:ro
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build: ./backend/auth_service
    ports:
      - "8006:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce
      AUTH_SECRET_KEY: aura-commerce-secret-2026
    volumes:
      - ./backend/shared:/app/backend/shared:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      VITE_PROXY_TARGET: docker
    volumes:
      - ./frontend/src:/app/src:ro
    depends_on:
      - product-service
      - cart-service
      - order-service
      - payment-service
      - notification-service
      - auth-service
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]

volumes:
  pgdata:
