apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-public-ingress
  namespace: ecommerce
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - http:
      paths:
      - path: /products
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 80
      - path: /cart
        pathType: Prefix
        backend:
          service:
            name: cart-service
            port:
              number: 80
      - path: /orders
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              number: 80
      - path: /payments
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 80
      - path: /notifications
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 80
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: product-service-nodeport
  namespace: ecommerce
spec:
  type: NodePort
  selector:
    app: product-service
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30001
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service-nodeport
  namespace: ecommerce
spec:
  type: NodePort
  selector:
    app: cart-service
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30002
---
apiVersion: v1
kind: Service
metadata:
  name: order-service-nodeport
  namespace: ecommerce
spec:
  type: NodePort
  selector:
    app: order-service
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30003
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service-nodeport
  namespace: ecommerce
spec:
  type: NodePort
  selector:
    app: payment-service
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30004
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service-nodeport
  namespace: ecommerce
spec:
  type: NodePort
  selector:
    app: notification-service
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30005
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service-nodeport
  namespace: ecommerce
spec:
  type: NodePort
  selector:
    app: auth-service
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30006
