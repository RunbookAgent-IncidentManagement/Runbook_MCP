apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ecommerce
  labels:
    app: payment-service
    version: v2.0.0-broken
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        version: v2.0.0-broken
    spec:
      containers:
      - name: api
        image: secretpower/payment-rba:v1
        imagePullPolicy: Never
        command: ["sh", "-c", "echo 'Simulating fatal application crash...' && exit 1"]
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
